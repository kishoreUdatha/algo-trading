server:
  port: 8090
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/algo
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
brokers:
  registry:
    upstox:
      baseUrl: "https://api.upstox.com"
      apiKey: "${UPSTOX_API_KEY:demo}"
      secret: "${UPSTOX_API_SECRET:demo}"
      active: true
    zerodha:
      baseUrl: "https://api.kite.trade"
      apiKey: "${KITE_API_KEY:demo}"
      secret: "${KITE_API_SECRET:demo}"
      active: true
resilience4j:
  retry:
    instances:
      broker:
        max-attempts: 3
        wait-duration: 250ms
  circuitbreaker:
    instances:
      broker:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
